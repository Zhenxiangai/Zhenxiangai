<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="180" viewBox="0 0 1000 180" role="img" aria-labelledby="title desc">
  <title id="title">ZhenxiangAI</title>
  <desc id="desc">AI Agent、个人知识系统与工作流自动化</desc>

  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9bff18" stop-opacity="0" />
      <stop offset="0.5" stop-color="#9bff18" stop-opacity="0.9" />
      <stop offset="1" stop-color="#9bff18" stop-opacity="0" />
    </linearGradient>
  </defs>

  <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" text-anchor="middle">
    <text x="500" y="75" fill="#9bff18" font-size="56" font-weight="750" letter-spacing="-1" filter="url(#glow)">ZhenxiangAI</text>
    <text x="500" y="116" fill="#6e7781" font-size="17" font-weight="600" letter-spacing="2">AI AGENT · PERSONAL KNOWLEDGE · AUTOMATION</text>
  </g>

  <path d="M270 143 H730" stroke="url(#line)" stroke-width="2" />
  <circle cx="500" cy="143" r="4" fill="#9bff18" />
</svg>
