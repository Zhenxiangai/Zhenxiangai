name: Sync profile data and activity

on:
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-readme-update
  cancel-in-progress: true

jobs:
  recent-activity:
    name: Refresh profile data and recent activity
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate profile generator
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests

      - name: Refresh project and radar cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_profile_projects.py

      - name: Publish profile data changes
        run: |
          if [ -z "$(git status --porcelain -- README.md assets/cards assets/projects)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- README.md assets/cards assets/projects
          git commit -m "chore: sync profile project data"
          git push

      - name: Update recent activity
        uses: jamesgeorge007/github-activity-readme@4aefbfa1c222d70537dc6a02f0519266aab2b1ea
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          GH_USERNAME: "Zhenxiangai"
          COMMIT_MSG: "chore: update recent GitHub activity"
          MAX_LINES: "5"
          TARGET_FILE: "README.md"
          FILTER_EVENTS: "IssueCommentEvent,IssuesEvent,PullRequestEvent,ReleaseEvent"
